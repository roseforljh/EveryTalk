<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>EveryTalk 企鹅</title>
  <!-- 原始 Logo 内嵌为数据，浏览器加载 favicon 时不依赖额外图片请求。 -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13" fill="#fdfdfd" stroke="#b8b8b8"/>
  <!-- 裁小显示视口里的空白，让企鹅在 16px 标签尺寸下仍占据足够面积。 -->
  <svg x="6" y="5" width="52" height="54" viewBox="96 86 320 340">
    <image style="image-rendering: pixelated" width="512" height="512" href="data:image/png;base64,"/>
  </svg>
</svg>
