          - entity: user_settings
            id: 80000000-0000-4000-8000-000000000004
            deleted: false
            payload:
              clientModifiedAt: 1792089000004
              kind: group_members
              key: V29yaw.2f2d2a7c-8f4c-4c50-b9a2-58e6e2d1a101
              value: {groupName: Work, conversationId: 2f2d2a7c-8f4c-4c50-b9a2-58e6e2d1a101}
          - entity: user_settings
            id: 80000000-0000-4000-8000-000000000005
            deleted: false
            payload:
              clientModifiedAt: 1792089000005
              kind: pinned_items
              key: 2f2d2a7c-8f4c-4c50-b9a2-58e6e2d1a101
              value: {}
          - entity: user_settings
            id: 80000000-0000-4000-8000-000000000006
            deleted: false
            payload:
              clientModifiedAt: 1792089000006
              kind: conversation_settings
              key: 2f2d2a7c-8f4c-4c50-b9a2-58e6e2d1a101
              value:
                modelId: 80000000-0000-4000-8000-000000000099
                webSearchEnabled: true
                mcpEnabled: false
                agentEnabled: false
                computerId: null
                systemPrompt: Answer concisely.
          - entity: user_settings
            id: 80000000-0000-4000-8000-000000000007
            deleted: false
            payload:
              clientModifiedAt: 1792089000007
              kind: mcp_servers
              key: 80000000-0000-4000-8000-000000000098
              value: {name: Unsafe example, headers: {Authorization: 'Bearer synthetic-example'}}
    ExtendedPushResult:
      summary: Corresponding per-item results; cascaded tombstones consume sequences
      value:
        results:
          - {index: 0, entity: user_settings, id: 80000000-0000-4000-8000-000000000001, status: accepted, server_seq: 101}
          - {index: 1, entity: user_settings, id: 80000000-0000-4000-8000-000000000002, canonical_id: 80000000-0000-4000-8000-000000000022, status: accepted, server_seq: 102}
          - {index: 2, entity: user_settings, id: 80000000-0000-4000-8000-000000000008, status: accepted, server_seq: 103}
          - {index: 3, entity: user_settings, id: 80000000-0000-4000-8000-000000000009, status: accepted, server_seq: 104}
          - {index: 4, entity: sessions, id: 2f2d2a7c-8f4c-4c50-b9a2-58e6e2d1a101, status: accepted, server_seq: 105}
          - {index: 5, entity: messages, id: 5a0fcaaf-a1ae-447d-9ae0-5b4c6fc8c202, status: accepted, server_seq: 106}
          - {index: 6, entity: attachments, id: 80000000-0000-4000-8000-000000000003, status: accepted, server_seq: 107}
          - {index: 7, entity: user_settings, id: 80000000-0000-4000-8000-000000000004, status: accepted, server_seq: 108}
          - {index: 8, entity: user_settings, id: 80000000-0000-4000-8000-000000000005, status: accepted, server_seq: 109}
          - {index: 9, entity: user_settings, id: 80000000-0000-4000-8000-000000000006, status: accepted, server_seq: 110}
          - index: 10
            entity: user_settings
            id: 80000000-0000-4000-8000-000000000007
            status: rejected
            reason: contains_secret
            error: {code: CONTAINS_SECRET, message: Configuration contains an unencrypted credential.}
    AdditiveMessage:
      summary: Add reasoning without editing existing text
      value:
        changes:
          - entity: messages
            id: 5a0fcaaf-a1ae-447d-9ae0-5b4c6fc8c202
            deleted: false
            payload:
              sessionId: 2f2d2a7c-8f4c-4c50-b9a2-58e6e2d1a101
              reasoning: Newly available reasoning.
    ResetObserved:
      summary: Other device observes a secrets reset even on an empty page
      value: {changes: [], next_cursor: 160, has_more: false, epoch: 0, secrets_epoch: 1}
  parameters:
    SyncVersion:
      name: X-EveryTalk-Sync-Version
      in: header
      required: true
      description: Required on every sync endpoint. Missing or any value other than 0.2.0 returns 426 after authentication.
      schema: {type: string, const: '0.2.0'}
      example: '0.2.0'
    SyncVersionRequired:
      name: X-EveryTalk-Sync-Version
      in: header
      required: true
      description: Required on every sync and file endpoint; missing or any value other than 0.2.0 returns 426. Authentication failures always remain 401.
      schema: {type: string, const: '0.2.0'}
      example: '0.2.0'
    SecretsEpoch:
      name: X-EveryTalk-Secrets-Epoch
      in: header
      required: false
      description: |
        Required for crypto creation and any envelope-bearing change. Compare
        to current per-user secrets_epoch under the sync lock. Missing/mismatch
        rejects only affected items; plaintext-free items are still processed.
      schema: {type: integer, minimum: 0, maximum: 9007199254740991}
      example: 0
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token. The server uses the JWT `sub` claim as `user_id`.

  schemas:
    SessionDeletedExample:
      type: object
      description: Example of a message pushed after its parent session was deleted.
      example:
        index: 0
        entity: messages
        id: 5a0fcaaf-a1ae-447d-9ae0-5b4c6fc8c202
        status: rejected
        error:
          code: session_deleted
          message: The session has been deleted; message content was not stored.

    JsonObject:
      type: object
      additionalProperties: true

    SyncEntity:
      type: string
      enum: [sessions, messages, memories, user_settings, attachments]
      description: attachments is part of the 0.2.0 view.

    SyncPayload:
      allOf:
        - $ref: '#/components/schemas/JsonObject'
        - type: object
          properties:
            clientModifiedAt:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
              description: |
                Unix milliseconds; required for sessions, memories, user_settings and attachments. The server
                compares min(clientModifiedAt, current_server_time).
          description: |
            Business payload. For sessions, memories, user_settings and attachments,
            clientModifiedAt is required and is never allowed to advance past
            the server clock. Equal effective values are won by the later arrival.

    RegisteredUserSettingPayload:
      type: object
      additionalProperties: true
      required: [clientModifiedAt, kind, key, value]
      properties:
        clientModifiedAt:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        kind:
          type: string
          enum: [api_configs, selected_models, web_search_configs, voice_configs, voice_llm_platforms, voice_custom_models, mcp_servers, skills, skill_variables, computers, computer_workspaces, conversation_settings, memory_switches, group_members, pinned_items, crypto_keys]
        key:
          type: string
          minLength: 1
          description: See x-setting-registry.key_rules; limits are UTF-8 bytes, not characters.
        value:
          type: object
          additionalProperties: true
          description: |
            Business configuration kept opaque except declared crypto, identity
            and file reference rules. Any property value can be an envelope.
            Other unknown value fields are allowed only after secret scanning.
      description: |
        Only with header 0.2.0. Entire payload limits and per-kind counts are
        normative in x-setting-registry, not inferred from JSON Schema lengths.
        Field names in value are scanned before sanitization; metadata kind/key
        and validated crypto structures are specifically exempt.
        For memory_switches/default, value contains exactly the booleans
        memoryEnabled and autoCaptureEnabled; other fields are rejected.
        A live deleted=false write with a later clientModifiedAt revives a
        deleted row; the same or older value does not.
      allOf:
        - if:
            properties: {kind: {const: crypto_keys}}
          then:
            properties:
              key: {const: default}
              value: {$ref: '#/components/schemas/CryptoKeysValue'}
        - if:
            properties: {kind: {const: conversation_settings}}
          then:
            properties:
              key: {type: string, format: uuid}
        - if:
            properties: {kind: {const: memory_switches}}
          then:
            properties:
              key: {const: default}
              value:
                type: object
                additionalProperties: false
                required: [memoryEnabled, autoCaptureEnabled]
                properties:
                  memoryEnabled: {type: boolean}
                  autoCaptureEnabled: {type: boolean}
        - if:
            properties: {kind: {const: group_members}}
          then:
            properties:
              key: {type: string, pattern: '^[A-Za-z0-9_-]+\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
              value: {$ref: '#/components/schemas/GroupMemberValue'}
        - if:
            properties: {kind: {const: pinned_items}}
          then:
            properties:
              key: {type: string, format: uuid}
        - if:
            properties: {kind: {const: skills}}
          then:
            properties:
              value:
                type: object
                properties:
                  fileRefs:
                    type: array
                    maxItems: 1024
                    uniqueItems: true
                    items: {type: string, format: uuid}
                    description: Explicit references to every owned ready component file, including manifest if stored as a file.

    ConfigurationTombstonePayload:
      type: object
      additionalProperties: false
      required: [clientModifiedAt, kind, key, value]
      properties:
        clientModifiedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        kind: {$ref: '#/components/schemas/RegisteredUserSettingPayload/properties/kind'}
        key: {type: string, minLength: 1}
        value: {type: object, maxProperties: 0}
      description: |
        Only for deleted=true, not a bypass for live config/crypto validation.
        crypto_keys deletion through push is rejected; reset creates its tombstone.
        Key identity/UTF-8 limits still apply, and current rows determine any
        file references to release rather than trusting a submitted empty value.

    EncryptedEnvelope:
      type: object
      additionalProperties: false
      required: ['$enc', alg, nonce, ct, keyVersion]
      properties:
        '$enc': {type: integer, const: 1}
        alg: {type: string, const: AES-256-GCM}
        nonce:
          type: string
          contentEncoding: base64
          pattern: '^[A-Za-z0-9+/]{16}$'
          description: Exactly 12 decoded bytes; canonical standard base64.
        ct:
          type: string
          contentEncoding: base64
          minLength: 24
          maxLength: 8192
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          description: |
            At least 16 decoded bytes (GCM tag), ciphertext followed by tag.
            Runtime additionally checks canonical padding/unused bits, decode
            length and <=8192 UTF-8 bytes for the ENTIRE compact envelope object.
        keyVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
      description: |
        Strict leaf. Any extra property or invalid marker/base64/size is rejected.
        The service validates format only, never decrypts or verifies the tag.
        Synthetic example bytes illustrate shape, not usable encryption material.
      example:
        '$enc': 1
        alg: AES-256-GCM
        nonce: AAECAwQFBgcICQoL
        ct: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
        keyVersion: 1

    CryptoKeysValue:
      type: object
      additionalProperties: false
      required: [version, kdf, kdfParams, salt, wrappedDek]
      properties:
        version: {type: integer, minimum: 1, maximum: 9007199254740991}
        kdf: {type: string, const: argon2id}
        kdfParams:
          type: object
          additionalProperties: false
          required: [memoryKiB, iterations, parallelism, outputBytes]
          properties:
            memoryKiB: {type: integer, minimum: 8192, maximum: 262144, example: 65536}
            iterations: {type: integer, minimum: 1, maximum: 10, example: 3}
            parallelism: {type: integer, minimum: 1, maximum: 4, example: 1}
            outputBytes: {type: integer, const: 32}
        salt:
          type: string
          contentEncoding: base64
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          description: Canonical base64 decoding to 16-32 bytes; generated on client.
        wrappedDek:
          $ref: '#/components/schemas/EncryptedEnvelope'
      description: |
        wrappedDek.ct must decode to exactly 48 bytes (32-byte DEK plus GCM tag).
        wrappedDek.keyVersion must equal version; version must equal current
        secrets_epoch+1 at creation. KDF parameters are bounded for receiving
        device safety, not server computation. No plaintext DEK, password or
        KEK accepted. Recommended new-client parameters are 65536 KiB, 3, 1.

    GroupMemberValue:
      type: object
      additionalProperties: true
      required: [groupName, conversationId]
      properties:
        groupName: {type: string, minLength: 1}
        conversationId: {type: string, format: uuid}
      description: Key must exactly encode these two fields; both are routing identity, not credential material.

    AttachmentPayload:
      type: object
      additionalProperties: true
      required: [clientModifiedAt, sessionId, messageId, name, mime, size, sha256, fileId, kind]
      properties:
        clientModifiedAt: {type: integer, minimum: 0, maximum: 9007199254740991}
        sessionId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        name: {type: string, maxLength: 255, description: 'Display name only; no filesystem path, CR/LF or control characters.'}
        mime: {type: string, maxLength: 127}
        size: {type: integer, minimum: 1, maximum: 9007199254740991}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        fileId: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [image, file, audio, thumbnail]}
      description: |
        id is the outer sync UUID; all business fields stay in payload. sessionId
        is additionally required so the server can cascade when messages arrive
        later. No arrival-order FK. messageId/sessionId cannot be changed on an
        existing attachment. Other fields use clamped clientModifiedAt LWW;
        fileId can be backfilled. Non-null fileId must be owned and ready and
        match size/sha256. MIME is a client declaration, not trusted active content.
        fileId=null means bytes are not yet uploaded; metadata can still sync.
        Raw attachment payload limit defaults to 4096 bytes; size metadata may
        exceed the effective upload cap with fileId=null, but upload still fails
        FILE_TOO_LARGE. A thumbnail is a separate attachment referencing the
        same message. A deleted attachment pulls payload={} and never revives.

    PushChange:
      type: object
      additionalProperties: true
      required: [entity, id, deleted, payload]
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        id:
          type: string
          format: uuid
          description: |
            Client supplied UUID. For user_settings this is only the proposed
            id; deduplication uses (authenticated user_id, payload.kind,
            payload.key).
        deleted:
          type: boolean
        payload:
          $ref: '#/components/schemas/SyncPayload'
      allOf:
        - if:
            properties:
              entity:
                enum: [sessions, memories, user_settings, attachments]
          then:
            properties:
              payload:
                required: [clientModifiedAt]
        - if:
            properties:
              entity:
                const: user_settings
              deleted: {const: false}
          then:
            properties:
              payload:
                anyOf:
                  - $ref: '#/components/schemas/RegisteredUserSettingPayload'
        - if:
            properties:
              entity: {const: user_settings}
              deleted: {const: true}
          then:
            properties:
              payload:
                anyOf:
                  - $ref: '#/components/schemas/ConfigurationTombstonePayload'
        - if:
            properties:
              entity: {const: attachments}
              deleted: {const: false}
          then:
            properties:
              payload: {$ref: '#/components/schemas/AttachmentPayload'}
      description: |
        Client supplied change. `user_id`, `created_at`, `updated_at`, and
        `server_seq` are never accepted from the client. Sensitive credential
        Message and memory fields use their defined discard list; 0.2.0 configs
        enforce x-secret-policy before storage. The applicable payload schema
        is selected by entity and the 0.2.0 contract.
        For user_settings,
        payload.kind and payload.key are required non-empty strings and form
        the logical key together with the authenticated user's id. For a new
        message, payload.sessionId must be a UUID. An existing message delete
        may omit sessionId; the server retains the indexed session_id column.
        Extra credential fields on the change are discarded and other
        unexpected fields are rejected.

    PushRequest:
      type: object
      additionalProperties: true
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          description: Overall shape is validated; each item is independently validated against PushChange.
          items: {}

    PushResult:
      description: One result per input item in input order. Rejected items allocate no sequence.
      type: object
      additionalProperties: false
      required: [index, status]
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based input position; identifies even a malformed item without an id.
        entity:
          $ref: '#/components/schemas/SyncEntity'
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, ignored, unchanged, rejected]
        server_seq:
          type: integer
          format: int64
          description: Omitted when status is rejected because no server sequence was allocated.
        canonical_id:
          type: string
          format: uuid
          description: |
            Optional server record id. Present when the server preserved an
            existing user_settings id that differs from the client id.
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          description: Present only when status is rejected.
          properties:
            code:
              type: string
              enum: [INVALID_CHANGE, MESSAGE_PAYLOAD_TOO_LARGE, INVALID_PAYLOAD, INVALID_CLIENT_MODIFIED_AT, INVALID_USER_SETTING_KIND, INVALID_USER_SETTING, INVALID_SESSION_ID, SETTING_ID_CONFLICT, MESSAGE_SESSION_MISMATCH, session_deleted, SETTING_PAYLOAD_TOO_LARGE, SETTING_COUNT_EXCEEDED, CONTAINS_SECRET, INVALID_ENVELOPE, INVALID_CRYPTO_KEYS, CRYPTO_KEY_CONFLICT, CRYPTO_KEY_VERSION_MISMATCH, SECRETS_EPOCH_MISMATCH, IMMUTABLE_FIELD, INVALID_ATTACHMENT, ATTACHMENT_PAYLOAD_TOO_LARGE, ATTACHMENT_PARENT_MISMATCH, message_deleted, FILE_NOT_FOUND, FILE_NOT_READY, FILE_METADATA_MISMATCH, FILE_DELETION_PENDING]
            message:
              type: string
              description: Safe validation reason; never echoes chat content or credentials.
        reason:
          type: string
          enum: [duplicate_message, message_is_append_only, already_deleted, no_server_change, contains_secret]
          description: contains_secret accompanies rejected/CONTAINS_SECRET; no sensitive value or matching field name is returned.

      allOf:
        - if:
            properties:
              status:
                const: rejected
          then:
            required: [error]
          else:
            required: [entity, id, server_seq]

    PushResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'

    SyncRecord:
      type: object
      additionalProperties: false
      required: [entity, id, payload, created_at, updated_at, deleted, server_seq]
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        id:
          type: string
          format: uuid
          description: |
            Server record id. Pull always returns this id. For user_settings
            it is the canonical id selected by the server, regardless of the
            id supplied by any device.
        payload:
          $ref: '#/components/schemas/SyncPayload'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Server timestamp assigned when the record version is written.
        deleted:
          type: boolean
        server_seq:
          type: integer
          format: int64

    PullResponse:
      type: object
      additionalProperties: false
      required: [changes, next_cursor, has_more, epoch, secrets_epoch]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncRecord'
        next_cursor:
          type: integer
          format: int64
        has_more:
          type: boolean
        epoch:
          type: integer
          format: int64
          minimum: 0
          description: Per-user generation, initially zero; increments after each delete-all.
        secrets_epoch:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            Additive field, always present for negotiated 0.2.0 (including empty
            pages). Increments on DELETE secrets and DELETE all. Does not replace
            epoch or next_cursor.

    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [size, sha256, mime]
      properties:
        size:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Declared bytes; server applies configured max_file_bytes, not the JSON integer maximum.
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        mime: {type: string, minLength: 1, maxLength: 127}

    UploadTicket:
      type: object
      additionalProperties: false
      required: [status, file_id]
      properties:
        status: {type: string, enum: [upload_required, ready]}
        file_id: {type: string, format: uuid}
        upload_id: {type: string, format: uuid}
        upload_path: {type: string, description: Relative path on this authenticated server, never a presigned R2 URL.}
        expires_at: {type: string, format: date-time}
      allOf:
        - if:
            properties: {status: {const: upload_required}}
          then:
            required: [upload_id, upload_path, expires_at]

    FileInfo:
      type: object
      additionalProperties: false
      required: [file_id, size, sha256, mime]
      properties:
        file_id: {type: string, format: uuid}
        size: {type: integer, minimum: 1, maximum: 9007199254740991}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        mime: {type: string}

    FileQuota:
      type: object
      additionalProperties: false
      required: [max_file_bytes, quota_bytes, used_bytes, reserved_bytes, available_bytes]
      properties:
        max_file_bytes: {type: integer, minimum: 1, maximum: 9007199254740991}
        quota_bytes: {type: integer, minimum: 1, maximum: 9007199254740991}
        used_bytes: {type: integer, minimum: 0, maximum: 9007199254740991}
        reserved_bytes: {type: integer, minimum: 0, maximum: 9007199254740991}
        available_bytes: {type: integer, minimum: 0, maximum: 9007199254740991}

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        timestamp:
          type: string
          format: date-time

    InternalErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              required: [request_id]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid

  responses:
    UnsupportedVersion:
      description: Explicit version unsupported, or this new endpoint requires 0.2.0.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: UNSUPPORTED_SYNC_VERSION, message: This endpoint requires sync protocol 0.2.0.}}
    FileTooLarge:
      description: Declared or streamed bytes exceed configured FILE_MAX_BYTES; no ready object is published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: FILE_TOO_LARGE, message: File exceeds the configured per-file limit.}}
    QuotaExceeded:
      description: Used plus reserved bytes plus this new digest exceed FILE_USER_QUOTA_BYTES; no reservation is created.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: QUOTA_EXCEEDED, message: User file quota exceeded.}}
    FileNotFound:
      description: Missing, unready, revoked, expired or owned by a different user; indistinguishable 404.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: FILE_NOT_FOUND, message: File or upload not found.}}
    FileServiceUnavailable:
      description: Database connectivity failure or R2 network/provider unavailability; invalid server credentials/configuration are internal errors (500).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: R2_UNAVAILABLE, message: File storage temporarily unavailable.}}
    Unauthorized:
      description: Missing, invalid, expired, or otherwise unacceptable Supabase access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required.
    PayloadTooLarge:
      description: Entire request body exceeds the configured limit; message payload overflow is a per-item rejection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body exceeds the configured limit.
    ValidationError:
      description: Overall JSON shape, batch count or pull cursor validation failed; individual invalid changes are per-item rejections.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: since must be a non-negative integer.
    RateLimited:
      description: The user exceeded the configured Redis-backed rate limit.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many synchronization requests.
    InternalError:
      description: Unexpected internal error; includes a server-generated request_id for matching sanitized server logs. No internal details are exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error.
              request_id: 'c575bce5-08de-4700-b162-5630b278aeb9'
    ServiceUnavailable:
      description: Required database connection is refused, lost, timed out, or the database is shutting down/starting up. Programming errors and SQL/configuration errors return 500. Redis connection failures bypass rate limiting with a warning instead of failing synchronization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Service temporarily unavailable.
